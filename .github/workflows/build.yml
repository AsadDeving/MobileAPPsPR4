name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  jvm-js-linux:
    name: JVM, JS and Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Source-set and compilation reports (Q16, Q17, Q20, Q21)
        run: >
          ./gradlew
          :advanced-lab:printSourceSets
          :advanced-lab:printCompilations
          :advanced-lab:printJvmMainCompilation
          :template-lab:printSourceSets
          :dependencies-lab:printCoroutinesVersions
      - name: Tests and builds (JVM, JS, Linux, shared metadata)
        run: >
          ./gradlew
          :advanced-lab:jvmTest
          :advanced-lab:compileKotlinJs
          :advanced-lab:linuxX64Test
          :advanced-lab:compileJvmAndJsMainKotlinMetadata
          :template-lab:jvmTest
          :template-lab:compileKotlinJs
          :template-lab:linuxX64Test
          :dependencies-lab:jvmTest
          :dependencies-lab:compileCommonMainKotlinMetadata
      - name: Q19 must fail with "Unresolved reference 'asExecutor'"
        run: |
          if ./gradlew :dependencies-lab:compileCommonMainKotlinMetadata -Pq19.showError=true > q19.log 2>&1; then
            echo "Expected the Q19 build to fail"; exit 1
          fi
          grep "Unresolved reference 'asExecutor'" q19.log

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS builds and simulator tests (Q17, Q18, Q20)
        run: >
          ./gradlew
          :advanced-lab:iosSimulatorArm64Test
          :advanced-lab:compileKotlinIosArm64
          :template-lab:iosSimulatorArm64Test
          :template-lab:compileKotlinIosArm64
          :dependencies-lab:iosSimulatorArm64Test
          :dependencies-lab:compileKotlinIosArm64
