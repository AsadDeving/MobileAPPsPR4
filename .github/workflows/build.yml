name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  jvm-js-linux:
    name: JVM, JS and Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Source-set and compilation reports (Q16, Q17, Q20, Q21)
        run: >
          ./gradlew
          :advanced-lab:printSourceSets
          :advanced-lab:printCompilations
          :advanced-lab:printJvmMainCompilation
          :template-lab:printSourceSets
          :dependencies-lab:printCoroutinesVersions
      - name: Tests and builds (JVM, JS, Linux, shared metadata)
        run: >
          ./gradlew
          :advanced-lab:jvmTest
          :advanced-lab:compileKotlinJs
          :advanced-lab:linuxX64Test
          :advanced-lab:compileJvmAndJsMainKotlinMetadata
          :template-lab:jvmTest
          :template-lab:compileKotlinJs
          :template-lab:linuxX64Test
          :dependencies-lab:jvmTest
          :dependencies-lab:compileCommonMainKotlinMetadata
      - name: Q19 must fail with "Unresolved reference 'asExecutor'"
        run: |
          if ./gradlew :dependencies-lab:compileCommonMainKotlinMetadata -Pq19.showError=true > q19.log 2>&1; then
            echo "Expected the Q19 build to fail"; exit 1
          fi
          grep "Unresolved reference 'asExecutor'" q19.log

      - name: "Practice 4.1: shared, Android app, desktop app, feature + umbrella modules"
        run: >
          ./gradlew
          :shared:printSourceSets
          :shared:jvmTest
          :shared:testDebugUnitTest
          :androidApp:testDebugUnitTest
          :androidApp:assembleDebug
          :desktopApp:test
          :feature:profile:jvmTest
          :umbrella:jvmTest
      - name: "Practice 4.1: run the desktop app"
        run: ./gradlew -q :desktopApp:run --args="student@ttpu.uz secret123"

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS builds and simulator tests (Q17, Q18, Q20)
        run: >
          ./gradlew
          :advanced-lab:iosSimulatorArm64Test
          :advanced-lab:compileKotlinIosArm64
          :template-lab:iosSimulatorArm64Test
          :template-lab:compileKotlinIosArm64
          :dependencies-lab:iosSimulatorArm64Test
          :dependencies-lab:compileKotlinIosArm64
      - name: "Practice 4.1: shared iOS tests (Task 12) and frameworks"
        run: >
          ./gradlew
          :shared:iosSimulatorArm64Test
          :shared:linkDebugFrameworkIosSimulatorArm64
          :umbrella:iosSimulatorArm64Test
          :umbrella:linkDebugFrameworkIosSimulatorArm64
      - name: "Task 14: typecheck the SwiftUI files against the Kotlin framework"
        run: >
          xcrun --sdk iphonesimulator swiftc -typecheck
          -target arm64-apple-ios15.0-simulator
          -F shared/build/bin/iosSimulatorArm64/debugFramework
          iosApp/iosApp/*.swift
      - name: "Task 19/20: exported feature types are in the umbrella header; without export they are not"
        run: |
          HEADER=umbrella/build/bin/iosSimulatorArm64/debugFramework/Shared.framework/Headers/Shared.h
          grep -E "SessionStore|ProfileService" "$HEADER"
          ./gradlew :umbrella:linkDebugFrameworkIosSimulatorArm64 -Ptask20.broken=true
          if grep -q "SessionStore" "$HEADER"; then echo "SessionStore should be hidden without export()"; exit 1; fi
          echo "Without api() + export(), SessionStore is not visible to Swift."
      - name: "Task 25: XCFramework + Swift package checksum"
        run: |
          ./gradlew :shared:assembleSharedXCFramework
          cd shared/build/XCFrameworks/release
          zip -qr Shared.xcframework.zip Shared.xcframework
          swift package compute-checksum Shared.xcframework.zip
      - name: "Task 24: publish to mavenLocal()"
        run: |
          ./gradlew :shared:publishToMavenLocal
          find ~/.m2/repository/uz/ttpu -name "*.module" | sort
